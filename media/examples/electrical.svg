<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2A2E35" stroke-width="1.5"/></pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#FFB27A" stop-opacity=".55"/><stop offset=".45" stop-color="#FF6A13" stop-opacity=".16"/><stop offset="1" stop-color="#FF6A13" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#16181C"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <!-- house outline -->
  <g fill="none" stroke="#5A616C" stroke-width="5" stroke-linejoin="round">
    <path d="M820 380 L1110 170 L1400 380"/><path d="M860 350 V760 H1360 V350"/>
    <path d="M960 760 V600 H1060 V760"/><rect x="1160" y="470" width="120" height="100"/><rect x="920" y="440" width="100" height="90"/>
  </g>
  <!-- traces -->
  <g fill="none" stroke="#FF6A13" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 640 H420 L480 580 H700 V420 H860"/>
    <path d="M700 580 V700 H860"/>
    <path d="M860 420 H1110 V300"/>
    <path d="M1110 420 V520 H1160"/>
    <path d="M860 700 H1000"/>
  </g>
  <g fill="none" stroke="#FF6A13" stroke-width="16" opacity=".35" filter="url(#soft)">
    <path d="M0 640 H420 L480 580 H700 V420 H860"/><path d="M860 420 H1110 V300"/>
  </g>
  <g fill="#16181C" stroke="#FF6A13" stroke-width="6">
    <circle cx="420" cy="640" r="12"/><circle cx="700" cy="580" r="12"/><circle cx="700" cy="420" r="12"/><circle cx="1110" cy="420" r="12"/>
  </g>
  <!-- panel -->
  <g transform="translate(560 600)">
    <rect width="120" height="170" rx="10" fill="#23262C" stroke="#8A919C" stroke-width="5"/>
    <g fill="#8A919C"><rect x="22" y="24" width="30" height="12" rx="3"/><rect x="68" y="24" width="30" height="12" rx="3"/><rect x="22" y="48" width="30" height="12" rx="3"/><rect x="68" y="48" width="30" height="12" rx="3"/><rect x="22" y="72" width="30" height="12" rx="3"/><rect x="68" y="72" width="30" height="12" rx="3"/></g>
    <rect x="22" y="100" width="76" height="14" rx="3" fill="#FF6A13"/>
  </g>
  <!-- bulb -->
  <circle cx="1110" cy="250" r="180" fill="url(#glow)"/>
  <g transform="translate(1110 250)">
    <path d="M-44 -10 a44 44 0 1 1 88 0 c0 26 -20 34 -22 56 h-44 c-2 -22 -22 -30 -22 -56z" fill="#FFD9B8" stroke="#FFB27A" stroke-width="4"/>
    <rect x="-22" y="50" width="44" height="12" rx="3" fill="#8A919C"/><rect x="-18" y="66" width="36" height="10" rx="3" fill="#8A919C"/>
  </g>
  <!-- outlet -->
  <g transform="translate(1000 700)"><rect x="-26" y="-36" width="52" height="72" rx="8" fill="#F3F4F1"/><rect x="-10" y="-22" width="6" height="16" rx="2" fill="#16181C"/><rect x="4" y="-22" width="6" height="16" rx="2" fill="#16181C"/><circle cx="0" cy="14" r="6" fill="#16181C"/></g>
  <!-- bolt -->
  <path d="M250 180 L180 360 H240 L200 520 L330 300 H262 L310 180Z" fill="#FF6A13"/>
