<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGENT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304141d'/%3E%3Cpath d='M7 9l9 7-9 7' fill='none' stroke='%237bd88f' stroke-width='3'/%3E%3Crect x='18' y='21' width='8' height='3' fill='%237bd88f'/%3E%3C/svg%3E">
<style>
:root {
  --ink: #d4e7ec;
  --dim: #7c93a0;
  --info: #4fd8e8;
  --ok: #7bd88f;
  --warn: #f2b84b;
  --err: #ff5a52;
  --fatal: #e45cff;
  --font: Menlo, "SF Mono", Consolas, "Liberation Mono", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  color: var(--ink);
  font: 15px/1.45 var(--font);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.info { color: var(--info); }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.err { color: var(--err); }
.dim { color: var(--dim); }
.fatal { color: var(--fatal); }

#hud {
  position: fixed;
  inset: 0;
  display: none;
  pointer-events: none;
  text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000;
}
#objective { position: absolute; top: 18px; left: 22px; color: var(--dim); }
#petline { position: absolute; top: 40px; left: 22px; color: var(--ok); }
#compass { position: absolute; top: 62px; left: 22px; color: var(--warn); display: none; }
#arrow { display: inline-block; }
#mapview {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: none;
  background: rgba(2, 6, 9, 0.9);
  outline: 1px solid #2a3a48;
  image-rendering: pixelated;
  pointer-events: none;
}
#boss {
  position: absolute;
  top: 18px;
  left: 50%;
  width: min(560px, 70vw);
  transform: translateX(-50%);
  text-align: center;
  display: none;
}
#boss .track { position: relative; height: 12px; margin-top: 6px; padding: 2px; border: 2px solid currentColor; background: rgba(0, 0, 0, 0.55); }
#bossfill { display: block; height: 100%; background: currentColor; transform-origin: left; transition: transform 0.12s linear; }
/* A boss with effort stages: the bar is cut into five, labelled underneath, and empties from the left,
   so it works its way through LOW to MAX. */
#boss.staged #bossfill { transform-origin: right; }
#boss.staged .track::after {
  content: '';
  position: absolute;
  inset: 2px;
  background: repeating-linear-gradient(to right, transparent 0 calc(20% - 2px), #000 calc(20% - 2px) 20%);
}
#bossstages { display: none; margin-top: 4px; font-size: 12px; }
#boss.staged #bossstages { display: flex; }
#bossstages span { flex: 1; color: var(--dim); }
#bossstages span.past { opacity: 0.5; text-decoration: line-through; }
#bossstages span.on { color: inherit; font-weight: 700; }
#cross { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; color: var(--ok); }
#cross.hit { color: #fff; transform: scale(1.35); }
#comms { position: absolute; left: 22px; bottom: 72px; width: min(720px, calc(100vw - 44px)); }
#comms div { margin-top: 2px; }
#vitals { position: absolute; left: 22px; bottom: 20px; font-size: 22px; }
#vitals .lbl { color: var(--dim); }
#gun { position: absolute; right: 22px; bottom: 20px; text-align: right; font-size: 18px; line-height: 1.25; }
#banner {
  position: absolute;
  left: 0;
  right: 0;
  top: 24%;
  text-align: center;
  opacity: 0;
}
#banner b { display: block; font-size: clamp(28px, 6vw, 64px); letter-spacing: 0.02em; }
#banner span { display: block; margin-top: 6px; font-size: 18px; }

#screen {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
#screen.title { background: radial-gradient(ellipse at 30% 50%, rgba(2, 8, 12, 0.88), rgba(2, 8, 12, 0.35)); justify-content: flex-start; padding-left: clamp(24px, 9vw, 140px); }
#screen.dark { background: #03080b; }
#screen.dim { background: rgba(2, 6, 9, 0.72); }
.card { width: min(780px, 100%); }
.card pre, .title pre { margin: 0; font: inherit; white-space: pre-wrap; }
.hint { margin: 28px 0 0; color: var(--dim); min-height: 1.45em; }
.title h1 { margin: 0; font-size: clamp(64px, 15vw, 176px); line-height: 1; font-weight: 700; letter-spacing: -0.03em; }
.title .tag { margin: 6px 0 36px; font-size: clamp(16px, 2.4vw, 22px); color: var(--info); }
.cursor {
  display: inline-block;
  width: 0.55em;
  height: 0.85em;
  margin-left: 0.08em;
  background: var(--ok);
  vertical-align: -0.06em;
  animation: blink 1.06s steps(1) infinite;
}
.card .cursor { width: 0.6em; height: 1em; vertical-align: -0.15em; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div id="objective"></div>
  <div id="petline"></div>
  <div id="compass"><span id="arrow">▲</span> <span id="dist"></span></div>
  <div id="boss"><div id="bossname"></div><div class="track"><i id="bossfill"></i></div><div id="bossstages"></div></div>
  <div id="banner"></div>
  <svg id="cross" viewBox="-12 -12 24 24" aria-hidden="true"><path d="M0-10V-3M0 3V10M-10 0H-3M3 0H10" stroke="currentColor" stroke-width="2" fill="none"/></svg>
  <div id="comms" aria-live="polite"></div>
  <div id="vitals"><span class="lbl">HP</span> <span id="hpbar"></span> <b id="hp"></b></div>
  <div id="gun"></div>
</div>
<canvas id="mapview"></canvas>
<div id="screen"></div>
